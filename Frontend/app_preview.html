<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VocaShield - Live UI Simulation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #0B0F19;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function VocaShieldApp() {
      const [currentScreen, setCurrentScreen] = useState('home');
      const [protectionEnabled, setProtectionEnabled] = useState(true);
      const [riskScore, setRiskScore] = useState(15);
      const [callDuration, setCallDuration] = useState(0);
      const [isSimulating, setIsSimulating] = useState(false);
      const [trustedContacts, setTrustedContacts] = useState([
        { id: 1, name: "Mom", relation: "Mother", phone: "+91 98765 11111", question: "What is the name of our family pet?" },
        { id: 2, name: "Rahul", relation: "Brother", phone: "+91 98765 33333", question: "Where did we go on vacation in 2022?" }
      ]);
      const [backendUrl, setBackendUrl] = useState('10.0.2.2:8000');
      const [newContact, setNewContact] = useState({ name: '', relation: '', phone: '', question: '' });

      // Live Analytics States
      const [authRisk, setAuthRisk] = useState(0);
      const [scamRisk, setScamRisk] = useState(0);
      const [identityRisk, setIdentityRisk] = useState(0);

      const wsRef = useRef(null);
      const audioCtxRef = useRef(null);
      const streamRef = useRef(null);

      // Simple real-time timer
      useEffect(() => {
        let timer;
        if (isSimulating && currentScreen === 'live') {
          timer = setInterval(() => setCallDuration(prev => prev + 1), 1000);
        }
        return () => clearInterval(timer);
      }, [isSimulating, currentScreen]);

      const startSimulation = async () => {
        setRiskScore(15);
        setAuthRisk(0);
        setScamRisk(0);
        setIdentityRisk(0);
        setCallDuration(0);
        setIsSimulating(true);
        setCurrentScreen('live');

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          streamRef.current = stream;

          const AudioContext = window.AudioContext || window.webkitAudioContext;
          const audioCtx = new AudioContext({ sampleRate: 16000 });
          audioCtxRef.current = audioCtx;

          const ws = new WebSocket(`ws://${backendUrl}/ws/call/WEB_${Date.now()}`);
          wsRef.current = ws;

          ws.onopen = () => {
            ws.send(JSON.stringify({
              type: "START",
              caller: { phone_number: "+919876599999", call_direction: "INCOMING" }
            }));

            const source = audioCtx.createMediaStreamSource(stream);
            const processor = audioCtx.createScriptProcessor(4096, 1, 1);
            source.connect(processor);
            processor.connect(audioCtx.destination);

            processor.onaudioprocess = (e) => {
              if (ws.readyState !== WebSocket.OPEN) return;
              const inputData = e.inputBuffer.getChannelData(0);
              const pcm16 = new Int16Array(inputData.length);
              for (let i = 0; i < inputData.length; i++) {
                let val = Math.max(-1, Math.min(1, inputData[i]));
                pcm16[i] = val < 0 ? val * 0x8000 : val * 0x7FFF;
              }
              ws.send(pcm16.buffer);
            };
          };

          ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.type === "analysis_update") {
              setRiskScore(data.overall_risk.score);
              if (data.voice_authenticity) setAuthRisk(Math.round(data.voice_authenticity.fake_probability * 100));
              if (data.scam_behavior) setScamRisk(data.scam_behavior.score);
              if (data.identity) setIdentityRisk(data.identity.identity_risk);
            } else if (data.type === "risk_escalation" && (data.new_level === "CRITICAL" || data.new_level === "HIGH")) {
              // setCurrentScreen('alert'); // Stay on live screen per user request to show recommendation below score
            }
          };

        } catch (e) {
          console.error("Mic error:", e);
          setIsSimulating(false);
          setCurrentScreen('home');
        }
      };

      const stopSimulation = () => {
        setIsSimulating(false);
        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
          wsRef.current.send(JSON.stringify({ type: "STOP" }));
          wsRef.current.close();
        }
        if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
        if (audioCtxRef.current) audioCtxRef.current.close();
        setCurrentScreen('home');
      };

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
        const secs = (seconds % 60).toString().padStart(2, '0');
        return `${mins}:${secs}`;
      };

      const getRiskColor = (score) => {
        if (score >= 80) return 'text-red-700 border-red-500 bg-red-50 shadow-[0_0_15px_rgba(239,68,68,0.3)]';
        if (score >= 35) return 'text-amber-700 border-amber-500 bg-amber-50 shadow-[0_0_15px_rgba(245,158,11,0.3)]';
        return 'text-teal-700 border-teal-500 bg-teal-50 shadow-[0_0_15px_rgba(20,184,166,0.3)]';
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-50 text-slate-900 flex flex-col justify-between shadow-2xl border border-slate-200">

          {/* Main Content Area */}
          <div className="p-4 flex-1 overflow-y-auto">

            {/* HOME SCREEN */}
            {currentScreen === 'home' && (
              <div className="space-y-5">
                <div className="flex justify-between items-center">
                  <div className="flex items-center space-x-2">
                    <span className="text-2xl">🛡️</span>
                    <h1 className="text-xl font-bold text-slate-900">VocaShield</h1>
                  </div>
                  <button onClick={() => setCurrentScreen('settings')} className="p-2 text-slate-500 hover:text-teal-600">⚙️</button>
                </div>

                <div className="bg-white shadow-sm p-6 rounded-2xl border border-slate-200 text-center space-y-3">
                  <p className="text-xs text-slate-500 font-semibold tracking-wider uppercase">Your Protection Status</p>
                  <div className="w-16 h-16 mx-auto bg-teal-500/20 rounded-full flex items-center justify-center border border-teal-500/40">
                    <div className="w-8 h-8 bg-teal-500 rounded-full animate-pulse"></div>
                  </div>
                  <h2 className="text-lg font-black text-teal-600 tracking-wider">PROTECTED</h2>
                  <p className="text-xs text-slate-500">Microphone permissions are required for real-time capture.</p>
                  <button
                    onClick={startSimulation}
                    className="w-full py-3 bg-teal-600 hover:bg-teal-500 rounded-xl font-bold text-sm transition"
                  >
                    ▶ Real-Time Detection
                  </button>
                </div>

                <div>
                  <h3 className="font-bold text-slate-800 mb-3 text-sm">Recent Calls</h3>
                  <div className="space-y-2">
                    <div onClick={() => setCurrentScreen('result')} className="p-3 bg-slate-100 shadow-sm rounded-xl flex justify-between items-center cursor-pointer hover:bg-slate-200">
                      <div>
                        <p className="font-semibold text-sm">Mom</p>
                        <p className="text-xs text-slate-500">+91 98765 11111 • 10:42 AM</p>
                      </div>
                      <span className="px-2 py-1 bg-teal-50 text-teal-600 text-xs font-bold rounded-lg border border-teal-200">SAFE 12/100</span>
                    </div>

                    <div onClick={() => setCurrentScreen('result')} className="p-3 bg-slate-100 shadow-sm rounded-xl flex justify-between items-center cursor-pointer hover:bg-slate-200">
                      <div>
                        <p className="font-semibold text-sm">Alex (Friend)</p>
                        <p className="text-xs text-slate-500">+91 98765 22222 • 09:31 AM</p>
                      </div>
                      <span className="px-2 py-1 bg-teal-50 text-teal-600 text-xs font-bold rounded-lg border border-teal-200">SAFE 18/100</span>
                    </div>

                    <div onClick={() => setCurrentScreen('result')} className="p-3 bg-slate-100 shadow-sm rounded-xl flex justify-between items-center cursor-pointer hover:bg-slate-200">
                      <div>
                        <p className="font-semibold text-sm">Unknown Caller</p>
                        <p className="text-xs text-slate-500">+91 98765 99999 • 08:15 AM</p>
                      </div>
                      <span className="px-2 py-1 bg-red-100 text-red-600 text-xs font-bold rounded-lg border border-red-800">HIGH 87/100</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* LIVE CALL SCREEN */}
            {currentScreen === 'live' && (
              <div className="space-y-5">
                <div className="flex justify-between items-center">
                  <button onClick={stopSimulation} className="text-slate-500 hover:text-teal-600">← Back</button>
                  <h2 className="font-bold">Live Call Screening</h2>
                  <span className="px-2 py-0.5 bg-red-100 text-red-500 border border-red-800 text-xs font-bold rounded-full animate-pulse">● LIVE</span>
                </div>

                <div className="text-center space-y-1">
                  <div className="w-14 h-14 bg-slate-200 rounded-full mx-auto flex items-center justify-center text-xl">👤</div>
                  <h3 className="font-bold text-lg">+91 98765 43210</h3>
                  <p className="text-xs text-slate-500">Duration: {formatTime(callDuration)}</p>
                </div>

                {/* Circular Dynamic Score */}
                <div className="text-center py-2">
                  <div className={`w-36 h-36 mx-auto rounded-full border-4 flex flex-col items-center justify-center shadow-lg transition-all duration-700 ${getRiskColor(riskScore)}`}>
                    <span className="text-4xl font-extrabold">{riskScore}</span>
                    <span className="text-xs font-semibold">/100</span>
                    <span className="text-[10px] font-bold tracking-widest mt-1">
                      {riskScore >= 80 ? 'CRITICAL RISK' : riskScore >= 35 ? 'MEDIUM RISK' : 'LOW RISK'}
                    </span>
                  </div>
                </div>

                {/* CRITICAL RECOMMENDATIONS TRIGGER */}
                {riskScore >= 80 && (
                  <div className="space-y-3 text-xs mt-3 mb-2 animate-pulse">
                    <div className="p-4 bg-red-50 border-2 border-red-500 rounded-xl space-y-3 shadow-[0_0_20px_rgba(239,68,68,0.3)]">
                      <h3 className="font-black text-red-600 text-sm flex items-center space-x-2"><span className="text-lg">🚨</span><span>CRITICAL ACTIONS REQUIRED</span></h3>

                      <div className="p-3 bg-white shadow-sm rounded-lg flex items-center space-x-3 cursor-pointer border border-red-200 hover:bg-slate-200 transition" onClick={stopSimulation}>
                        <span className="p-2 bg-red-100 text-red-600 rounded-lg">📞</span>
                        <div>
                          <p className="font-bold text-slate-900">1. End Call Immediately</p>
                          <p className="text-slate-500 text-[10px]">AASIST Detected High Deepfake Confidence</p>
                        </div>
                      </div>

                      <div className="p-3 bg-white shadow-sm rounded-lg flex items-center space-x-3 cursor-pointer border border-teal-200 hover:bg-slate-200 transition" onClick={() => setCurrentScreen('verification')}>
                        <span className="p-2 bg-teal-100 text-teal-600 rounded-lg shadow-lg">🗣️</span>
                        <div>
                          <p className="font-bold text-slate-900">2. Ask Secret Question</p>
                          <p className="text-slate-500 text-[10px]">Challenge caller's claimed identity manually</p>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* Meters */}
                <div className="bg-white shadow-sm p-4 rounded-xl space-y-2 border border-slate-200 text-xs">
                  <p className="font-bold text-slate-700">Risk Breakdown</p>
                  <div>
                    <div className="flex justify-between"><span>Voice Risk (AASIST)</span><span className="font-bold text-red-600">{authRisk}%</span></div>
                    <div className="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden mt-1"><div className="bg-red-500 h-full transition-all duration-300" style={{ width: `${authRisk}%` }}></div></div>
                  </div>
                  <div>
                    <div className="flex justify-between"><span>Scam Risk (Intent)</span><span className="font-bold text-red-600">{scamRisk}%</span></div>
                    <div className="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden mt-1"><div className="bg-red-500 h-full transition-all duration-300" style={{ width: `${scamRisk}%` }}></div></div>
                  </div>
                  <div>
                    <div className="flex justify-between"><span>Identity Mismatch</span><span className="font-bold text-amber-600">{identityRisk}%</span></div>
                    <div className="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden mt-1"><div className="bg-amber-500 h-full transition-all duration-300" style={{ width: `${identityRisk}%` }}></div></div>
                  </div>
                </div>

                {/* Signals */}
                <div className="space-y-2">
                  <p className="text-xs font-bold text-slate-700">Detected Warning Signals</p>
                  <div className="p-3 bg-white shadow-sm rounded-lg border border-red-200/60 flex items-center space-x-3 text-xs">
                    <span className="text-red-600">⚠️</span>
                    <div>
                      <p className="font-bold text-slate-800">Synthetic voice characteristics</p>
                      <p className="text-slate-500 text-[11px]">AASIST spectral mismatch detected</p>
                    </div>
                  </div>
                  <div className="p-3 bg-white shadow-sm rounded-lg border border-amber-900/60 flex items-center space-x-3 text-xs">
                    <span className="text-amber-600">⚠️</span>
                    <div>
                      <p className="font-bold text-slate-800">Financial request & Urgency</p>
                      <p className="text-slate-500 text-[11px]">Requesting bank transfer to unknown account</p>
                    </div>
                  </div>
                </div>

                <div className="flex space-x-2 pt-2">
                  <button onClick={() => setCurrentScreen('verification')} className="flex-1 py-3 bg-teal-600 hover:bg-teal-500 rounded-xl font-bold text-xs">
                    VERIFY CALLER
                  </button>
                  <button onClick={stopSimulation} className="py-3 px-4 bg-red-100 text-red-600 hover:bg-red-900 rounded-xl font-bold text-xs border border-red-800">
                    END CALL
                  </button>
                </div>
              </div>
            )}

            {/* RISK ALERT SCREEN */}
            {currentScreen === 'alert' && (
              <div className="space-y-6 text-center py-6">
                <div className="w-24 h-24 bg-red-100 rounded-full mx-auto flex items-center justify-center border-4 border-red-500 animate-bounce">
                  <span className="text-4xl">🚨</span>
                </div>

                <div className="space-y-2">
                  <h2 className="text-xl font-black text-red-500 tracking-wider">CRITICAL RISK DETECTED</h2>
                  <p className="text-4xl font-extrabold text-slate-800">{riskScore}/100</p>
                </div>

                <div className="bg-[#1E1B2E] p-4 rounded-xl border border-red-500/40 text-left text-xs space-y-1">
                  <p className="font-bold text-red-600">High Confidence AI Deepfake Pattern</p>
                  <p className="text-slate-700">VocaShield AI detected synthetic voice acoustics combined with urgency and financial transfer requests.</p>
                </div>

                <div className="space-y-3 pt-4">
                  <button onClick={stopSimulation} className="w-full py-4 bg-red-600 hover:bg-red-500 rounded-xl font-extrabold text-sm tracking-wide shadow-lg shadow-red-900/50">
                    END CALL IMMEDIATELY
                  </button>
                  <button onClick={() => setCurrentScreen('verification')} className="w-full py-3 bg-teal-600 hover:bg-teal-500 rounded-xl font-bold text-xs">
                    VERIFY CALLER IDENTITY
                  </button>
                  <button onClick={() => setCurrentScreen('live')} className="w-full py-2 text-slate-500 hover:text-teal-600 text-xs">
                    Dismiss Warning
                  </button>
                </div>
              </div>
            )}

            {/* VERIFICATION SCREEN */}
            {currentScreen === 'verification' && (
              <div className="space-y-5">
                <div className="flex items-center space-x-3">
                  <button onClick={() => setCurrentScreen('live')} className="text-slate-500">←</button>
                  <h2 className="font-bold text-lg">Identity Verification</h2>
                </div>

                <div className="bg-slate-100 shadow-sm p-4 rounded-xl border border-teal-400/40 text-xs space-y-2">
                  <p className="text-slate-500">Caller claims to be: <strong className="text-white text-sm">Brother (Rahul)</strong></p>
                  <div className="p-3 bg-white shadow-sm rounded-lg border border-red-500/30">
                    <p className="text-slate-500 text-[11px] font-bold">Secret Question to Ask:</p>
                    <p className="text-amber-600 font-semibold text-sm">"Where did we go on vacation in 2022?"</p>
                  </div>
                </div>

                <div className="space-y-3 text-xs">
                  <p className="font-bold text-slate-700">Recommended Actions</p>

                  <div className="p-3 bg-slate-100 shadow-sm rounded-xl flex items-center space-x-3 cursor-pointer hover:bg-slate-200" onClick={stopSimulation}>
                    <span className="p-2 bg-red-100 text-red-600 rounded-lg">📞</span>
                    <div>
                      <p className="font-bold text-slate-800">1. End the call immediately</p>
                      <p className="text-slate-500">Do not transfer funds over unverified calls</p>
                    </div>
                  </div>

                  <div className="p-3 bg-slate-100 shadow-sm rounded-xl flex items-center space-x-3 cursor-pointer hover:bg-slate-200">
                    <span className="p-2 bg-teal-100 text-teal-600 rounded-lg">📲</span>
                    <div>
                      <p className="font-bold text-slate-800">2. Call trusted number manually</p>
                      <p className="text-slate-500">Dial +91 98765 33333 directly</p>
                    </div>
                  </div>
                </div>

                <button onClick={() => {
                  if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
                    wsRef.current.send(JSON.stringify({ type: "VERIFICATION", status: "PASSED" }));
                  }
                  setCurrentScreen('live');
                }} className="w-full py-3 bg-teal-600 hover:bg-teal-500 rounded-xl font-bold text-xs">
                  MARK CALL AS VERIFIED SAFE
                </button>
                <button onClick={() => {
                  if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
                    wsRef.current.send(JSON.stringify({ type: "VERIFICATION", status: "FAILED" }));
                  }
                  setCurrentScreen('alert');
                }} className="w-full py-3 mt-2 bg-red-900 border border-red-500 hover:bg-red-800 rounded-xl font-bold text-xs">
                  VERIFICATION FAILED (IMPERSONATOR)
                </button>
              </div>
            )}

            {/* CALL RESULT REPORT SCREEN */}
            {currentScreen === 'result' && (
              <div className="space-y-5">
                <div className="flex items-center space-x-3">
                  <button onClick={() => setCurrentScreen('home')} className="text-slate-500">←</button>
                  <h2 className="font-bold text-lg">Post-Call Threat Report</h2>
                </div>

                <div className="bg-white shadow-sm p-4 rounded-xl border border-slate-200 space-y-2">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="font-bold text-sm">Unknown Caller</h3>
                      <p className="text-xs text-slate-500">+91 98765 99999 • 08:15 AM</p>
                    </div>
                    <span className="px-2 py-1 bg-red-100 text-red-600 text-xs font-bold rounded-lg border border-red-800">HIGH 87/100</span>
                  </div>
                </div>

                <div className="bg-slate-100 shadow-sm p-4 rounded-xl space-y-2 text-xs">
                  <p className="font-bold text-slate-800">Call Risk Progression Chart</p>
                  <div className="h-20 bg-slate-100 rounded-lg flex items-end justify-between p-2">
                    <div className="w-4 bg-teal-500 h-[15%] rounded-t"></div>
                    <div className="w-4 bg-amber-500 h-[32%] rounded-t"></div>
                    <div className="w-4 bg-amber-500 h-[51%] rounded-t"></div>
                    <div className="w-4 bg-red-500 h-[72%] rounded-t"></div>
                    <div className="w-4 bg-red-500 h-[87%] rounded-t"></div>
                  </div>
                </div>
              </div>
            )}

            {/* CALL HISTORY LOGS */}
            {currentScreen === 'calls' && (
              <div className="space-y-4">
                <h2 className="text-xl font-bold">Call History Logs</h2>
                <div className="space-y-2">
                  <div onClick={() => setCurrentScreen('result')} className="p-3 bg-slate-100 shadow-sm rounded-xl flex justify-between items-center cursor-pointer">
                    <div>
                      <p className="font-semibold text-sm">Mom</p>
                      <p className="text-xs text-slate-500">+91 98765 11111</p>
                    </div>
                    <span className="px-2 py-1 bg-teal-50 text-teal-600 text-xs font-bold rounded-lg">SAFE 12</span>
                  </div>
                  <div onClick={() => setCurrentScreen('result')} className="p-3 bg-slate-100 shadow-sm rounded-xl flex justify-between items-center cursor-pointer">
                    <div>
                      <p className="font-semibold text-sm">Unknown Caller</p>
                      <p className="text-xs text-slate-500">+91 98765 99999</p>
                    </div>
                    <span className="px-2 py-1 bg-red-100 text-red-600 text-xs font-bold rounded-lg">HIGH 87</span>
                  </div>
                </div>
              </div>
            )}

            {/* TRUSTED CONTACTS */}
            {currentScreen === 'trusted' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-xl font-bold">Trusted Contacts</h2>
                  <button onClick={() => setCurrentScreen('add_contact')} className="px-3 py-1.5 bg-teal-600 hover:bg-teal-500 rounded-lg text-xs font-bold">+ Add</button>
                </div>
                <div className="space-y-3">
                  {trustedContacts.map(c => (
                    <div key={c.id} className="p-4 bg-slate-100 shadow-sm rounded-xl space-y-2 border border-slate-200 text-xs">
                      <div className="flex justify-between">
                        <span className="font-bold text-sm">{c.name} ({c.relation})</span>
                        <span className="text-teal-600 font-bold">✓ Verified</span>
                      </div>
                      <p className="text-slate-500">{c.phone}</p>
                      <div className="p-2 bg-white shadow-sm rounded border border-slate-300">
                        <p className="text-slate-500 text-[10px]">Secret Question:</p>
                        <p className="text-slate-800 font-medium">{c.question}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ADD TRUSTED CONTACT */}
            {currentScreen === 'add_contact' && (
              <div className="space-y-4 text-xs">
                <div className="flex items-center space-x-2">
                  <button onClick={() => setCurrentScreen('trusted')} className="text-slate-500">←</button>
                  <h2 className="text-lg font-bold">Add Trusted Contact</h2>
                </div>
                <input
                  placeholder="Full Name"
                  value={newContact.name}
                  onChange={e => setNewContact({ ...newContact, name: e.target.value })}
                  className="w-full p-3 bg-slate-100 shadow-sm border border-slate-300 rounded-xl text-slate-900 outline-none placeholder-slate-400 focus:border-teal-400"
                />
                <input
                  placeholder="Relationship (e.g. Brother)"
                  value={newContact.relation}
                  onChange={e => setNewContact({ ...newContact, relation: e.target.value })}
                  className="w-full p-3 bg-slate-100 shadow-sm border border-slate-300 rounded-xl text-slate-900 outline-none placeholder-slate-400 focus:border-teal-400"
                />
                <input
                  placeholder="Phone Number"
                  value={newContact.phone}
                  onChange={e => setNewContact({ ...newContact, phone: e.target.value })}
                  className="w-full p-3 bg-slate-100 shadow-sm border border-slate-300 rounded-xl text-slate-900 outline-none placeholder-slate-400 focus:border-teal-400"
                />
                <input
                  placeholder="Private Verification Question"
                  value={newContact.question}
                  onChange={e => setNewContact({ ...newContact, question: e.target.value })}
                  className="w-full p-3 bg-slate-100 shadow-sm border border-slate-300 rounded-xl text-slate-900 outline-none placeholder-slate-400 focus:border-teal-400"
                />
                <button
                  onClick={() => {
                    if (newContact.name && newContact.phone) {
                      setTrustedContacts([...trustedContacts, { id: Date.now(), ...newContact }]);
                      setCurrentScreen('trusted');
                    }
                  }}
                  className="w-full py-3 bg-teal-600 hover:bg-teal-500 rounded-xl font-bold text-sm"
                >
                  SAVE TRUSTED CONTACT
                </button>
              </div>
            )}

            {/* SETTINGS SCREEN */}
            {currentScreen === 'settings' && (
              <div className="space-y-5 text-xs">
                <div className="flex items-center space-x-2">
                  <button onClick={() => setCurrentScreen('home')} className="text-slate-500">←</button>
                  <h2 className="text-lg font-bold">Settings</h2>
                </div>

                <div className="p-4 bg-slate-100 shadow-sm rounded-xl flex justify-between items-center border border-slate-200">
                  <div>
                    <p className="font-bold text-sm">Real-time Call Shield</p>
                    <p className="text-slate-500">Active background screening</p>
                  </div>
                  <input
                    type="checkbox"
                    checked={protectionEnabled}
                    onChange={e => setProtectionEnabled(e.target.checked)}
                    className="w-5 h-5 accent-emerald-500"
                  />
                </div>

                <div className="p-4 bg-slate-100 shadow-sm rounded-xl space-y-2 border border-slate-200">
                  <p className="font-bold text-sm">Backend WebSocket Endpoint (IP:PORT)</p>
                  <input value={backendUrl} onChange={e => setBackendUrl(e.target.value)} className="w-full p-2 bg-white shadow-sm border border-slate-300 rounded text-slate-700" />
                </div>
              </div>
            )}

          </div>

          {/* BOTTOM NAVIGATION BAR */}
          <div className="bg-white shadow-sm border-t border-slate-200 py-3 px-6 flex justify-around text-xs">
            <button
              onClick={() => setCurrentScreen('home')}
              className={`flex flex-col items-center ${currentScreen === 'home' ? 'text-teal-600 font-bold' : 'text-slate-500'}`}
            >
              <span>🏠</span>
              <span>Home</span>
            </button>
            <button
              onClick={() => setCurrentScreen('calls')}
              className={`flex flex-col items-center ${currentScreen === 'calls' ? 'text-teal-600 font-bold' : 'text-slate-500'}`}
            >
              <span>📞</span>
              <span>Calls</span>
            </button>
            <button
              onClick={() => setCurrentScreen('trusted')}
              className={`flex flex-col items-center ${currentScreen === 'trusted' || currentScreen === 'add_contact' ? 'text-teal-600 font-bold' : 'text-slate-500'}`}
            >
              <span>👥</span>
              <span>Trust</span>
            </button>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<VocaShieldApp />);
  </script>
</body>

</html>
