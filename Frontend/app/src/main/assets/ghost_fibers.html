<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F8FAFC;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');

    if (!gl) {
      document.body.style.background = '#F8FAFC';
    } else {
      const vert = `
    attribute vec2 a_pos;
    void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
  `;

      const frag = `
    precision highp float;
    uniform vec2 uRes;
    uniform float uTime;

    #define PI 3.14159265

    mat2 rot(float a) {
      float s = sin(a), c = cos(a);
      return mat2(c, -s, s, c);
    }

    float hash(vec2 p) {
      p = floor(p);
      float h = 52.9829189 * fract(dot(p, vec2(0.065, 0.005)));
      return fract(h);
    }

    float grain(vec2 px) {
      vec2 p = mod(px + vec2(uTime * 30.0, -uTime * 21.0), 1024.0);
      vec2 r = mat2(0.8, -0.5, 0.5, 0.8) * p;
      float g = 0.0;
      g += 0.40 * hash(r);
      g += 0.25 * hash(r * 2.0 + 17.0);
      g += 0.20 * hash(r * 4.0 + 47.0);
      g += 0.10 * hash(r * 8.0 + 113.0);
      g += 0.05 * hash(r * 16.0 + 191.0);
      return g;
    }

    void main() {
      vec2 uv = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;
      float t = uTime * 0.2;

      // White/slate-50 backdrop for light mode
      vec3 backdrop = vec3(0.9725, 0.9804, 0.9882);

      // Teal line and glow colors
      vec3 lineCol = vec3(0.0510, 0.5804, 0.5333);  // #0D9488 teal-600
      vec3 glowCol = vec3(0.8000, 0.9843, 0.9451);  // #CCFBF1 teal-50

      vec2 p = uv / 2.2;
      p = rot(t * 0.15) * p;

      vec3 color = vec3(0.0);
      float fiberField = 0.0;
      int layers = 4;

      for (int i = 1; i <= 4; i++) {
        float fi = float(i);
        p += 0.015 * sin(p.yx * fi * 3.0 + t * (0.15 + fi * 0.08));

        float radius = length(p);
        float angle = atan(p.y, p.x);
        angle += sin(radius * 5.0 - t * 1.2 + fi) * 0.1;
        p = vec2(cos(angle), sin(angle)) * radius;

        float lines = abs(sin(p.x * (5.0 + fi * 2.0) + sin(p.y * 3.0 + t)));
        lines = pow(max(0.0, 1.0 - lines), 16.0);
        fiberField += lines / fi;
        color += lineCol * lines / fi;

        float glow = exp(-10.0 * abs(sin(p.x * 3.0 + t + fi)));
        color += glowCol * glow * 1.6 / (fi * 2.0);
      }

      float center = exp(-2.2 * dot(uv, uv));
      vec3 centerTone = max(lineCol * 0.856 - glowCol * 0.062, vec3(0.0));
      color += centerTone * center;

      float cloud = exp(-1.5 * length(uv + vec2(sin(t * 0.3) * 0.25, cos(t * 0.25) * 0.18)));
      vec3 cloudTone = lineCol * 0.196 + glowCol * 0.227;
      color += cloudTone * cloud;

      float vignette = 1.0 - smoothstep(0.35, 1.45, length(uv));
      color *= mix(0.8, 1.0, vignette);
      color = 1.0 - exp(-color * 2.5);
      color.b *= 1.05;

      // Light mode compositing — ink on white
      float edgeFade = mix(0.8, 1.0, vignette);
      float fibers = pow(smoothstep(0.12, 1.05, fiberField) * edgeFade, 1.5);
      float atm = (center * 0.025 + cloud * 0.015) * edgeFade;
      vec3 fiberInk = mix(backdrop, lineCol, 0.52);
      vec3 airColor = mix(backdrop, glowCol, 0.16);

      vec3 out_color = mix(backdrop, airColor, atm);
      out_color = mix(out_color, fiberInk, fibers * 0.85);

      float noise = (grain(gl_FragCoord.xy) - 0.5) * 0.03;
      out_color = clamp(out_color + noise, 0.0, 1.0);

      gl_FragColor = vec4(out_color, 1.0);
    }
  `;

      function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      }

      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
      gl.linkProgram(prog);
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

      const loc = gl.getAttribLocation(prog, 'a_pos');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

      const uRes = gl.getUniformLocation(prog, 'uRes');
      const uTime = gl.getUniformLocation(prog, 'uTime');

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(uRes, canvas.width, canvas.height);
      }

      window.addEventListener('resize', resize);
      resize();

      function loop(t) {
        requestAnimationFrame(loop);
        gl.uniform1f(uTime, t * 0.001);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }

      requestAnimationFrame(loop);
    }
  </script>
</body>

</html>
